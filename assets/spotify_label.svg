<svg width="400" height="32" viewBox="0 0 400 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="spotGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1DB954"/>
      <stop offset="100%" style="stop-color:#1ed760"/>
    </linearGradient>
    <filter id="spotGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feFlood flood-color="#1DB954" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Spotify-green equalizer icon -->
  <g transform="translate(8, 6)" filter="url(#spotGlow)">
    <rect x="0" y="10" width="3" height="10" rx="1" fill="url(#spotGrad)">
      <animate attributeName="height" values="10;18;6;14;10" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="10;2;14;6;10" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="5" y="6" width="3" height="14" rx="1" fill="url(#spotGrad)">
      <animate attributeName="height" values="14;8;18;10;14" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="6;12;2;10;6" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="10" y="8" width="3" height="12" rx="1" fill="url(#spotGrad)">
      <animate attributeName="height" values="12;18;8;16;12" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="8;2;12;4;8" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="15" y="12" width="3" height="8" rx="1" fill="url(#spotGrad)">
      <animate attributeName="height" values="8;16;10;14;8" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="12;4;10;6;12" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Text label -->
  <text x="35" y="21"
        font-family="'SF Mono', 'Fira Code', monospace"
        font-size="12" fill="#8b949e" letter-spacing="0.08em">
    now playing on spotify
  </text>
</svg>
